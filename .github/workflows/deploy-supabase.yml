name: Deploy Supabase

on:
  push:
    branches: [main]
    paths:
      - 'Anaxly-waitlist-main/supabase/**'
      - '.github/workflows/deploy-supabase.yml'
  workflow_dispatch:

concurrency:
  group: deploy-supabase
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
    defaults:
      run:
        working-directory: Anaxly-waitlist-main
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Link project
        run: supabase link --project-ref "$SUPABASE_PROJECT_REF" --password "$SUPABASE_DB_PASSWORD"
      - name: Push database migrations
        run: supabase db push --password "$SUPABASE_DB_PASSWORD"
      - name: Deploy edge functions
        run: supabase functions deploy send-access-email --no-verify-jwt --project-ref "$SUPABASE_PROJECT_REF"
